services:
  db:
    image: postgis/postgis:15-3.4
    container_name: offshore_qa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antarctic_nav
    ports:
      - "5432:5432"
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
      - ./offshore_db.dump:/tmp/offshore_db.dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_qa_data:
