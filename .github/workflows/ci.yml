name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: |
          export PYTHONPATH=backend
          pytest backend/tests

      - name: MLOps Smoke Test - Sea Ice Model (XGBoost)
        run: |
          export PYTHONPATH=.
          python -m ml.training.seaice_train

      - name: MLOps Smoke Test - Trajectory Model (XGBoost)
        run: |
          export PYTHONPATH=.
          python -m ml.training.trajectory_train
          
      - name: MLOps Smoke Test - Monitor Check
        run: |
          export PYTHONPATH=.
          python -m mlops.monitor
