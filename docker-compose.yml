services:
  database:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: offshore
      POSTGRES_USER: offshore
      POSTGRES_PASSWORD: offshore
    ports:
      - "5432:5432"

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - database
